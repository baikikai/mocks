<style>
/* Layout: fixed app shell (header, breadcrumb bar) around two panels. Left ink panel is the one shape that morphs between views. */
:root {
  --ink: #14171C; --ink2: #1D2128; --paper: #ECEDE8; --stone: #C4C8C0; --indigo: #2C3E72; --lilac: #9AA7D4;
  --muted-d: #4B5058; --rule-d: #3A3F47; --hov: #DADCD5;
  --display: 'Shippori Mincho', 'Hiragino Mincho ProN', serif;
  --body: 'Zen Kaku Gothic New', 'Hiragino Sans', system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--ink); color: var(--paper); font-family: var(--body); overflow: hidden; }
button { all: unset; box-sizing: border-box; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--lilac); outline-offset: -2px; }
.app { height: 100%; display: flex; flex-direction: column; }
.label { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }

.crumbs { view-transition-name: crumbs; transition: background-color .35s, border-color .35s; flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 12px 24px; border-bottom: 1px solid var(--rule-d); background: var(--ink); min-height: 46px; box-sizing: border-box; }
.crumbs button { color: var(--stone); padding: 4px 2px; }
.crumbs button:hover { color: var(--paper); text-decoration: underline; }
.crumbs .cur { color: var(--paper); }
.crumbs .sep { color: var(--rule-d); }
#view { flex: 1; min-height: 0; display: flex; }

/* Entry: five columns */
.cols { flex: 1; min-width: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); min-height: 0; }
.col { display: flex; flex-direction: column; min-height: 0; min-width: 0; border-right: 1px solid var(--rule-d); background: var(--ink); padding: 22px 0 0; }
.col:last-child { border-right: 0; }
.col .head { padding: 0 20px 14px; }
.col .num { font-family: var(--display); font-size: 18px; color: var(--lilac); }
.col h2 { font-family: var(--display); font-weight: 400; font-size: 34px; line-height: 1.05; margin: 4px 0 4px; }
.col .sub { font-size: 13px; color: var(--stone); }
.col .list { flex: 1; min-height: 0; overflow-y: auto; border-top: 1px solid var(--rule-d); }
.item { width: 100%; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 11px 20px; border-bottom: 1px solid var(--rule-d); font-family: var(--display); font-size: 19px; transition: background .2s, padding-left .25s; }
.item:hover { background: var(--ink2); padding-left: 26px; }
.item small { font-family: var(--body); font-size: 13px; color: var(--stone); white-space: nowrap; }
.foot { padding: 10px 20px; font-size: 12px; color: var(--stone); border-top: 1px solid var(--rule-d); }

/* Drill, flat, waza: left ink panel plus right paper panel */
.split { flex: 1; min-width: 0; display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); min-height: 0; }
.left { background: var(--ink2); padding: 28px 32px; display: flex; flex-direction: column; gap: 14px; min-height: 0; overflow-y: auto; border-right: 1px solid var(--rule-d); }
.left .big { font-family: var(--display); font-size: clamp(40px, 6vw, 84px); line-height: 1; margin: 6px 0 0; text-wrap: balance; }
.left .big small { font-size: .45em; color: var(--stone); margin-left: .25em; }
.left .meta { color: var(--stone); font-size: 15px; }
.pins { margin-top: auto; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { display: inline-flex; align-items: center; border: 1px dashed var(--rule-d); border-radius: 999px; font-size: 13px; color: var(--stone); }
.pill.on { border-style: solid; border-color: var(--lilac); color: var(--paper); }
.pill.ed { background: var(--indigo); border-color: var(--indigo); }
.pill button { padding: 6px 12px; display: inline-flex; gap: 8px; align-items: baseline; color: inherit; }
.pill b { font-weight: 400; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--stone); }
.pill .x { padding: 6px 12px 6px 0; color: var(--lilac); font-size: 15px; }
.crumbs .pill button:hover { text-decoration: none; color: var(--paper); }
.row.cur { background: var(--hov); box-shadow: inset 4px 0 0 var(--indigo); }
.row.any .rl { color: var(--muted-d); }
.pin { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--rule-d); font-family: var(--display); font-size: 19px; }
.pin span:first-child { font-family: var(--body); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--stone); }
.pin:hover { color: var(--lilac); }
.link { color: var(--lilac); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; padding: 6px 0; align-self: flex-start; }
.link:hover { text-decoration: underline; }
.video { flex: 1; min-height: 160px; background: var(--ink); display: flex; align-items: center; justify-content: center; }
.play { border: 1px solid var(--paper); padding: 12px 22px; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; transition: background-color .2s, color .2s; }
.play:hover { background: var(--paper); color: var(--ink); }
.right { background: var(--paper); color: var(--ink); min-height: 0; overflow-y: auto; display: flex; flex-direction: column; }
.rhead { padding: 24px 32px 14px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid var(--ink); }
.rhead h3 { font-family: var(--display); font-weight: 400; font-size: 28px; margin: 0; }
.rhead .label { color: var(--muted-d); }
.row { width: 100%; display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 0 32px; min-height: 64px; border-bottom: 1px solid var(--stone); transition: background .2s, padding-left .25s; animation: rise .35s ease both; animation-delay: calc(var(--i, 0) * 22ms); }
.row:hover { background: var(--hov); padding-left: 40px; }
.row:focus-visible { outline-color: var(--indigo); }
.row .rn { font-family: var(--display); font-size: 18px; color: var(--indigo); }
.row .rl { font-family: var(--display); line-height: 1.1; }
.row .rl small { font-size: .55em; color: var(--muted-d); margin-left: .35em; }
.row .rm { font-size: 13px; color: var(--muted-d); white-space: nowrap; }
.right.nos { overflow: hidden; }
.rscroll { flex: 1; min-height: 0; overflow-y: auto; touch-action: pan-y; }
.row.all { flex: none; background: var(--ink); color: var(--paper); border-bottom: 0; animation: none; padding-right: 160px; }
.row.all:hover { background: var(--indigo); }
.row.all .rm { color: var(--stone); }
.group { padding: 14px 32px 8px; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted-d); border-bottom: 1px solid var(--ink); background: var(--paper); }
.rbody { padding: 22px 32px; display: flex; flex-direction: column; gap: 18px; }
.seg { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.seg button { padding: 8px 16px; border: 1px solid var(--ink); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
.seg button.on { background: var(--ink); color: var(--paper); }
.seg .rk { margin-left: auto; color: var(--muted-d); font-size: 13px; }
.steps { border-top: 1px solid var(--ink); }
.steps div { display: grid; grid-template-columns: 90px minmax(0, 1fr); padding: 12px 0; border-bottom: 1px solid var(--stone); font-size: 15px; }
.steps span:first-child { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted-d); }
.otitle { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted-d); }
.others .row { min-height: 52px; padding: 0; grid-template-columns: minmax(0, 1fr) auto; }
.others .row:hover { padding-left: 8px; }
.others .rl { font-size: 20px; }

@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* Transitions: one shape (the ink panel) morphs; everything else crossfades. */
::view-transition-old(root), ::view-transition-new(root) { animation: none; }
::view-transition-group(*) { animation-duration: 0s; }
#view { background: var(--ink2); }
::view-transition-image-pair(*) { isolation: auto; }
::view-transition-old(*), ::view-transition-new(*) { animation-duration: 480ms; animation-timing-function: cubic-bezier(.65, 0, .25, 1); animation-fill-mode: both; mix-blend-mode: normal; }
html[data-dir="fwd"]::view-transition-old(*) { animation-name: out-l; }
html[data-dir="fwd"]::view-transition-new(*) { animation-name: in-r; }
html[data-dir="back"]::view-transition-old(*) { animation-name: out-r; }
html[data-dir="back"]::view-transition-new(*) { animation-name: in-l; }
html[data-dir]::view-transition-new(site-header), html[data-dir]::view-transition-new(crumbs), html[data-dir]::view-transition-new(site-footer) { animation: none; }
html[data-dir]::view-transition-old(site-header), html[data-dir]::view-transition-old(crumbs), html[data-dir]::view-transition-old(site-footer) { display: none; }
::view-transition-new(pr) { animation-delay: 80ms; }
::view-transition-new(c1) { animation-delay: 50ms; } ::view-transition-new(c2) { animation-delay: 100ms; } ::view-transition-new(c3) { animation-delay: 150ms; } ::view-transition-new(c4) { animation-delay: 200ms; }
@keyframes out-l { to { transform: translateX(-60%); opacity: 0; } }
@keyframes in-r { from { transform: translateX(60%); opacity: 0; } }
@keyframes out-r { to { transform: translateX(60%); opacity: 0; } }
@keyframes in-l { from { transform: translateX(-60%); opacity: 0; } }
::view-transition-group(site-header), ::view-transition-group(crumbs), ::view-transition-group(site-footer) { animation: none; z-index: 100; }
::view-transition-old(site-header), ::view-transition-old(crumbs), ::view-transition-old(site-footer) { display: none; }
::view-transition-new(site-header), ::view-transition-new(crumbs), ::view-transition-new(site-footer) { animation: none; }
::view-transition { pointer-events: none; }
@media (prefers-reduced-motion: reduce) {
  ::view-transition-old(*), ::view-transition-new(*), ::view-transition-group(*) { animation-duration: 0s !important; animation-delay: 0s !important; }
  .row { animation: none; }
}

  (function () {
    var vp = document.getElementById('vp'), st = document.getElementById('stage');

  })();
