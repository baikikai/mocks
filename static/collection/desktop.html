*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
#vp{position:fixed;inset:52px 0 0 0;overflow:hidden;touch-action:none}
#board{position:absolute;left:0;top:0;transform-origin:0 0;width:1280px;height:1008px}
.zc{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;z-index:9}
.zc button{width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:#f3eee4;color:#14171c;font:500 16px var(--body)}
.st{position:absolute;left:0;top:112px;width:1280px;height:800px;overflow:hidden;font-family:var(--body);background:var(--bg);color:var(--fg)}
.t{position:absolute;display:block;overflow:hidden;transition:left .95s cubic-bezier(.7,0,.2,1),top .95s cubic-bezier(.7,0,.2,1),width .95s cubic-bezier(.7,0,.2,1),height .95s cubic-bezier(.7,0,.2,1),opacity .6s}
.im,.imb{position:absolute;inset:0;background-repeat:no-repeat;transition:transform 1.1s cubic-bezier(.7,0,.2,1),filter .6s}
.im{filter:sepia(.35) saturate(.95) contrast(1.05);transform-origin:0 0}
.imk{background-image:var(--K);background-size:auto 100%;background-position:center}
.imb{background-image:var(--K);background-size:cover;background-position:center;filter:blur(30px) brightness(.55) sepia(.5);transform:scale(1.3)}
.ims{background-image:var(--F);background-size:auto 130%;background-position:34% 100%;transform-origin:center}
.t:hover .im.ims{transform:scale(1.06)}
.v-home .t:hover .imk{transform:scale(1.05)}
.hero .ims{animation:kb 16s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.07)}}
.t::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(43,16,14,.5),rgba(43,16,14,0) 28%,rgba(43,16,14,0) 52%,rgba(43,16,14,.78));transition:opacity .8s}
.v-detail .t::after{opacity:0}
.t.dim .im{filter:sepia(.45) saturate(.6) brightness(.55)}
.ov{position:absolute;inset:0;pointer-events:none;z-index:5}
.ov button{pointer-events:auto}
.v-home .dots button,.v-home .pn button,.o-k .pn.os button,.o-s .pn.ok button,.o-s .dots button{pointer-events:none}
.hm{opacity:1;transition:opacity .6s .45s,transform .9s cubic-bezier(.2,.8,.2,1) calc(.45s + var(--d,0s))}
.v-detail .hm{opacity:0;pointer-events:none;transition-delay:0s;transform:translateY(-14px)}
.dt{opacity:0;pointer-events:none;transform:translateY(20px);transition:opacity .5s,transform .5s}
.v-detail .dt{opacity:1;transform:none;transition:opacity .7s calc(.55s + var(--d,0s)),transform .9s cubic-bezier(.2,.8,.2,1) calc(.55s + var(--d,0s))}
.o-s .dt.ok,.o-k .dt.os{opacity:0!important;pointer-events:none!important}
.lbl{font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:500}
.bk{font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:500;border-bottom:1px solid currentColor;padding-bottom:3px}
.bar{position:absolute;left:0;right:0;top:0;height:72px;padding:0 36px;display:flex;justify-content:space-between;align-items:center;z-index:5;font:400 22px var(--display)}
.cp{position:absolute;left:36px;bottom:34px;z-index:4;width:max-content;max-width:560px}
