<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Brooklyn Aikikai Mocks</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap">
<style>
/* One column of cards on a quiet ground: a rule and a label per group, a photo, two ways in (desktop and phone). Dark by default, like the site. */
:root{
  --D:'Shippori Mincho','Hiragino Mincho ProN',serif;
  --B:'Zen Kaku Gothic New','Hiragino Sans',system-ui,sans-serif;
  --bg:#14171C;--panel:#1B2029;--fg:#ECEDE8;--mut:#B9BDB5;--line:rgba(236,237,232,.2);--gold:#E2B53F;--tx:#E2B53F;--ink:#14171C;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#ECEDE8;--panel:#E1E3DB;--fg:#14171C;--mut:#4B5058;--line:rgba(20,23,28,.22);--tx:#8A5E00;color-scheme:light}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:400 17px/25px var(--B);padding-inline:clamp(20px,5vw,60px);padding-block:60px 100px}
a{color:inherit;text-decoration:none}
.wrap{max-width:1160px;margin:0 auto}
header{padding-bottom:60px}
h1{font:400 clamp(56px,10vw,120px)/1 var(--D);letter-spacing:-.02em;margin:0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:60px 30px}
.card{display:flex;flex-direction:column;gap:20px;min-width:0}
.card .im{display:block;position:relative;aspect-ratio:16/10;overflow:hidden;background:var(--panel);border:1px solid var(--line);transition:border-color .2s cubic-bezier(.16,1,.3,1)}
.card .im img{display:block;width:100%;height:100%;object-fit:cover}
.card:hover .im{border-color:var(--gold)}
.card h3{margin:0;font:400 30px/35px var(--D);letter-spacing:-.01em}
.go{display:flex;gap:10px;flex-wrap:wrap}
.go a{display:inline-flex;align-items:center;gap:10px;padding:10px 20px;border:1px solid var(--line);font-size:15px;line-height:20px;transition:border-color .2s cubic-bezier(.16,1,.3,1),color .2s cubic-bezier(.16,1,.3,1)}
.go a:hover{border-color:var(--gold);color:var(--tx)}
.go a i{font-style:normal;color:var(--mut)}
a:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
@media (max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}h1{font-size:clamp(48px,16vw,80px)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Mocks</h1></header>
  <div class="grid">
    <article class="card">
      <a class="im" href="rev16/" tabindex="-1" aria-hidden="true"><img src="thumbs/rev16.jpg" alt="" width="960" height="600" loading="lazy"></a>
      <h3>Rev 16 Viewport</h3>
      <div class="go"><a href="rev16/">Desktop <i>→</i></a><a href="rev16/mobile/">Mobile <i>→</i></a></div>
    </article>
    <article class="card">
      <a class="im" href="rev16-baseline/" tabindex="-1" aria-hidden="true"><img src="thumbs/rev16.jpg" alt="" width="960" height="600" loading="lazy"></a>
      <h3>Rev 16 Baseline</h3>
      <div class="go"><a href="rev16-baseline/">Desktop <i>→</i></a><a href="rev16-baseline/mobile/">Mobile <i>→</i></a></div>
    </article>
    <article class="card">
      <a class="im" href="rev17/" tabindex="-1" aria-hidden="true"><img src="thumbs/rev17.jpg" alt="" width="960" height="600" loading="lazy"></a>
      <h3>Rev 17 Rail</h3>
      <div class="go"><a href="rev17/">Desktop <i>→</i></a><a href="rev17/mobile/">Mobile <i>→</i></a></div>
    </article>
    <article class="card">
      <a class="im" href="rev18/" tabindex="-1" aria-hidden="true"><img src="thumbs/rev18.jpg" alt="" width="960" height="600" loading="lazy"></a>
      <h3>Rev 18 Pigment</h3>
      <div class="go"><a href="rev18/">Desktop <i>→</i></a><a href="rev18/mobile/">Mobile <i>→</i></a></div>
    </article>
    <article class="card">
      <a class="im" href="rev19/" tabindex="-1" aria-hidden="true"><img src="thumbs/rev19.jpg" alt="" width="960" height="600" loading="lazy"></a>
      <h3>Rev 19 Index</h3>
      <div class="go"><a href="rev19/">Desktop <i>→</i></a><a href="rev19/mobile/">Mobile <i>→</i></a></div>
    </article>
    <article class="card">
      <a class="im" href="technique/" tabindex="-1" aria-hidden="true"><img src="thumbs/technique.jpg" alt="" width="960" height="600" loading="lazy"></a>
      <h3>Technique Database v14</h3>
      <div class="go"><a href="technique/">Desktop <i>→</i></a><a href="technique/mobile/">Mobile <i>→</i></a></div>
    </article>
    <article class="card">
      <a class="im" href="collection/" tabindex="-1" aria-hidden="true"><img src="thumbs/collection.jpg" alt="" width="960" height="600" loading="lazy"></a>
      <h3>Collection Lacquer v2</h3>
      <div class="go"><a href="collection/">Desktop <i>→</i></a><a href="collection/mobile/">Mobile <i>→</i></a></div>
    </article>
    <article class="card">
      <a class="im" href="donate/" tabindex="-1" aria-hidden="true"><img src="thumbs/donate.jpg" alt="" width="960" height="600" loading="lazy"></a>
      <h3>Donate Page</h3>
      <div class="go"><a href="donate/">Desktop <i>→</i></a><a href="donate/mobile/">Mobile <i>→</i></a></div>
    </article>
  </div>
</div>
</body>
</html>
